name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "aiindex/output/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public
          cp -r site/. public/
          # the tables the figures are cells of, and the checks each one passed, beside the page
          mkdir -p public/data/tables
          cp aiindex/output/tables/*.csv public/data/tables/
          cp aiindex/output/checks.csv aiindex/output/manifest.json public/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
